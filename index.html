<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NedaluOf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #ffffff;
        }
        .center-container {
            text-align: center;
            padding: 1rem;
        }
        .main-name {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 800;
            color: #1a1a2e;
        }
        .sub-text {
            margin-top: 0.75rem;
            font-size: clamp(1rem, 4vw, 1.8rem);
            font-weight: 500;
        }
        .red-part {
            color: #e63946;
        }
        .normal-part {
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="center-container">
        <div class="main-name">NedaluOf</div>
        <div class="sub-text">
            <span class="red-part">8K</span><span class="normal-part">-Developers Apps</span>
        </div>
    </div>
</body>
</html>
